<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<title id="title">UX AI Context — From scattered work to shared understanding</title>
<desc id="desc">An infographic showing how UX AI Context connects scattered project work into durable shared context for people, AI, and experiences such as Periscope.</desc>
<defs>
  <linearGradient id="sky" x1="0" x2="1">
    <stop offset="0" stop-color="#F7FAFF"/>
    <stop offset="1" stop-color="#FFF9F0"/>
  </linearGradient>
  <linearGradient id="blueCard" x1="0" x2="1">
    <stop offset="0" stop-color="#EDF6FF"/>
    <stop offset="1" stop-color="#F6F3FF"/>
  </linearGradient>
  <linearGradient id="greenCard" x1="0" x2="1">
    <stop offset="0" stop-color="#EFFBF5"/>
    <stop offset="1" stop-color="#F6FFF2"/>
  </linearGradient>
  <linearGradient id="peachCard" x1="0" x2="1">
    <stop offset="0" stop-color="#FFF4EE"/>
    <stop offset="1" stop-color="#FFF9F1"/>
  </linearGradient>
  <linearGradient id="lavCard" x1="0" x2="1">
    <stop offset="0" stop-color="#F7F3FF"/>
    <stop offset="1" stop-color="#F2F7FF"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#15224A" flood-opacity=".08"/>
  </filter>
  <style>
    .bg{fill:url(#sky)}
    .navy{fill:#102451}
    .muted{fill:#465879}
    .small{font:500 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .body{font:500 23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .body2{font:500 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .label{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .h2{font:800 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .title{font:800 54px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .eyebrow{font:800 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.4px}
    .pill{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .center{text-anchor:middle}
    .card{stroke:#E4EAF4;stroke-width:1.5}
    .arrow{stroke:#6A8FC7;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .iconStroke{stroke:#173E78;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>

<rect class="bg" width="1600" height="1120" rx="28"/>

<!-- Header -->
<text x="58" y="58" class="eyebrow navy">UX AI CONTEXT</text>
<text x="58" y="122" class="title navy">From scattered work to shared understanding.</text>
<text x="58" y="166" class="body muted">Capture what matters. Help people. Enable AI. Do the work once. Create many possibilities.</text>

<!-- top story -->
<rect x="50" y="215" width="455" height="320" rx="28" fill="url(#peachCard)" class="card" filter="url(#shadow)"/>
<text x="82" y="265" class="h2 navy">The challenge</text>
<text x="82" y="307" class="body navy">Important project context lives</text>
<text x="82" y="340" class="body navy">across many tools and conversations.</text>

<!-- scattered source icons -->
<g transform="translate(88,382)">
  <rect x="0" y="0" width="100" height="64" rx="16" fill="#FFFFFF" opacity=".9"/>
  <circle cx="28" cy="28" r="14" fill="#5865F2"/><text x="54" y="36" class="pill navy">Teams</text>
  <rect x="118" y="0" width="126" height="64" rx="16" fill="#FFFFFF" opacity=".9"/>
  <circle cx="146" cy="28" r="14" fill="#118A70"/><text x="172" y="36" class="pill navy">Figma</text>
  <rect x="262" y="0" width="122" height="64" rx="16" fill="#FFFFFF" opacity=".9"/>
  <circle cx="290" cy="28" r="14" fill="#1677D2"/><text x="316" y="36" class="pill navy">Jira</text>
  <rect x="0" y="78" width="145" height="64" rx="16" fill="#FFFFFF" opacity=".9"/>
  <circle cx="28" cy="106" r="14" fill="#218B71"/><text x="54" y="114" class="pill navy">Research</text>
  <rect x="163" y="78" width="160" height="64" rx="16" fill="#FFFFFF" opacity=".9"/>
  <circle cx="191" cy="106" r="14" fill="#2774C9"/><text x="217" y="114" class="pill navy">SharePoint</text>
</g>
<text x="82" y="505" class="small muted">Easy to lose. Hard to connect. Difficult to reuse.</text>

<path d="M520 375 H552 M540 361 L554 375 L540 389" class="arrow"/>

<rect x="570" y="215" width="455" height="320" rx="28" fill="url(#blueCard)" class="card" filter="url(#shadow)"/>
<text x="602" y="265" class="h2 navy">The shared context layer</text>
<text x="602" y="306" class="body navy">A simple, structured repository for</text>
<text x="602" y="339" class="body navy">durable project context — people + AI.</text>
<rect x="610" y="374" width="230" height="125" rx="18" fill="#FFFFFF" stroke="#D9E4F1"/>
<text x="635" y="410" class="label navy">uxai-context/</text>
<text x="650" y="443" class="small muted">projects/</text>
<text x="675" y="474" class="small muted">periscope/</text>
<text x="872" y="395" class="pill navy">✓ Clear structure</text>
<text x="872" y="430" class="pill navy">✓ Easy to contribute</text>
<text x="872" y="465" class="pill navy">✓ Reusable templates</text>
<text x="872" y="500" class="pill navy">✓ Works with AI tools</text>

<path d="M1040 375 H1072 M1060 361 L1074 375 L1060 389" class="arrow"/>

<rect x="1090" y="215" width="460" height="320" rx="28" fill="url(#greenCard)" class="card" filter="url(#shadow)"/>
<text x="1122" y="265" class="h2 navy">The outcome</text>
<text x="1122" y="306" class="body navy">Richer collaboration. Greater visibility.</text>
<text x="1122" y="339" class="body navy">A better foundation for what comes next.</text>
<text x="1122" y="390" class="body2 navy">● Faster onboarding and alignment</text>
<text x="1122" y="427" class="body2 navy">● Easier to find and connect context</text>
<text x="1122" y="464" class="body2 navy">● Less time searching, more time doing</text>
<text x="1122" y="501" class="body2 navy">● Context becomes more valuable over time</text>

<!-- how it works -->
<rect x="50" y="570" width="1500" height="205" rx="28" fill="#F3F8FF" class="card"/>
<text x="78" y="615" class="h2 navy">How it works</text>
<text x="78" y="648" class="body2 muted">From first visit to durable contribution — a few simple steps.</text>

<g>
  <circle cx="130" cy="704" r="28" fill="#6657D9"/><text x="130" y="713" class="label center" fill="#fff">1</text>
  <text x="130" y="749" class="pill center navy">Start</text>

  <path d="M182 704 H250 M236 690 L252 704 L236 718" class="arrow"/>
  <circle cx="305" cy="704" r="28" fill="#2574DC"/><text x="305" y="713" class="label center" fill="#fff">2</text>
  <text x="305" y="749" class="pill center navy">Get oriented</text>

  <path d="M370 704 H438 M424 690 L440 704 L424 718" class="arrow"/>
  <circle cx="493" cy="704" r="28" fill="#1D9B83"/><text x="493" y="713" class="label center" fill="#fff">3</text>
  <text x="493" y="749" class="pill center navy">Use a template</text>

  <path d="M570 704 H638 M624 690 L640 704 L624 718" class="arrow"/>
  <circle cx="693" cy="704" r="28" fill="#F3B344"/><text x="693" y="713" class="label center" fill="#fff">4</text>
  <text x="693" y="749" class="pill center navy">Add context</text>

  <path d="M772 704 H840 M826 690 L842 704 L826 718" class="arrow"/>
  <circle cx="895" cy="704" r="28" fill="#E96078"/><text x="895" y="713" class="label center" fill="#fff">5</text>
  <text x="895" y="749" class="pill center navy">Commit + share</text>

  <text x="1000" y="695" class="body2 navy">Small contributions compound.</text>
  <text x="1000" y="728" class="body2 muted">Capture what changed while it is fresh.</text>
</g>

<!-- functions -->
<text x="58" y="827" class="h2 navy">Contribute in the way that works for you</text>
<text x="58" y="860" class="body2 muted">Functions, not job titles. Different skills. Same shared context.</text>

<g transform="translate(50,885)">
  <rect x="0" y="0" width="235" height="126" rx="24" fill="url(#lavCard)" class="card"/>
  <text x="118" y="38" class="label center navy">Create</text>
  <text x="118" y="70" class="small center muted">design · content · stories</text>
  <text x="118" y="99" class="small center muted">prototype context</text>

  <rect x="252" y="0" width="235" height="126" rx="24" fill="url(#blueCard)" class="card"/>
  <text x="370" y="38" class="label center navy">Explore</text>
  <text x="370" y="70" class="small center muted">research · discovery</text>
  <text x="370" y="99" class="small center muted">evidence + insight</text>

  <rect x="504" y="0" width="235" height="126" rx="24" fill="url(#greenCard)" class="card"/>
  <text x="622" y="38" class="label center navy">Build</text>
  <text x="622" y="70" class="small center muted">engineering · prototypes</text>
  <text x="622" y="99" class="small center muted">implementation learning</text>

  <rect x="756" y="0" width="235" height="126" rx="24" fill="url(#peachCard)" class="card"/>
  <text x="874" y="38" class="label center navy">Guide</text>
  <text x="874" y="70" class="small center muted">strategy · planning</text>
  <text x="874" y="99" class="small center muted">direction + decisions</text>

  <rect x="1008" y="0" width="235" height="126" rx="24" fill="url(#blueCard)" class="card"/>
  <text x="1126" y="38" class="label center navy">Enable</text>
  <text x="1126" y="70" class="small center muted">operations · facilitation</text>
  <text x="1126" y="99" class="small center muted">connections + flow</text>

  <rect x="1260" y="0" width="235" height="126" rx="24" fill="url(#lavCard)" class="card"/>
  <text x="1378" y="38" class="label center navy">Learn</text>
  <text x="1378" y="70" class="small center muted">ask · observe · connect</text>
  <text x="1378" y="99" class="small center muted">move work forward</text>
</g>

<!-- footer -->
<rect x="50" y="1040" width="720" height="54" rx="22" fill="#EEF9F5"/>
<text x="75" y="1075" class="label navy">How we know it’s working:</text>
<text x="315" y="1075" class="small muted">easier to find · more reused · less searching · better onboarding</text>

<rect x="795" y="1040" width="755" height="54" rx="22" fill="#F5F1FF"/>
<text x="820" y="1075" class="label navy">What this enables next:</text>
<text x="1065" y="1075" class="small muted">discovery · synthesis · relationships · agents · new experiences</text>
</svg>