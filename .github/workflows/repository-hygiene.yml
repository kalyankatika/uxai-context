name: Repository hygiene

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 14 * * 1"

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/secret_scan.py

  context-staleness:
    name: Context staleness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/context_staleness.py
